name: ZeroHype Outbound Batch

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Process outbound lead batch
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node << 'EOF'
          const fs = require('fs');

          const QUEUE_PATH = 'zerohype_queue_state.json';
          if (!fs.existsSync(QUEUE_PATH)) {
            console.error('Queue state file not found:', QUEUE_PATH);
            process.exit(1);
          }

          const state = JSON.parse(fs.readFileSync(QUEUE_PATH, 'utf8'));
          let remaining = state.remaining_queue || [];

          if (remaining.length === 0) {
            console.log('No remaining leads in queue.');
            process.exit(0);
          }

          const batch = remaining.slice(0, 20);
          const nextRemaining = remaining.slice(20);

          async function sendEmail(lead) {
            const body = `Hi there,\n\nI ran a teardown of your core funnel on ${lead.domain}.\n\n${lead.friction_point}\n\nNo pitch or fluff. We mapped the exact 2 friction points where high-intent visitors drop off before converting.\n\nIf you want to see the 2-minute breakdown, reply to this email.\n\nZeroHype Team`;

            const payload = {
              from: 'ZeroHype <contact@zerohypelab.com>',
              to: [lead.email],
              reply_to: 'zerohype@proton.me',
              subject: `${lead.name}: visitor drop-off from launch traffic`,
              text: body
            };

            const res = await fetch('https://api.resend.com/emails', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.RESEND_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(payload)
            });

            if (!res.ok) {
              const errText = await res.text();
              throw new Error(`Resend error for ${lead.email}: ${res.status} ${errText}`);
            }

            return await res.json();
          }

          async function run() {
            let sentCount = 0;
            const sentBatch = [];
            for (const lead of batch) {
              try {
                const res = await sendEmail(lead);
                lead.status = 'outreach_sent';
                lead.sent_at = new Date().toISOString();
                lead.resend_id = res.id;
                sentBatch.push(lead);
                sentCount++;
                await new Promise(r => setTimeout(r, 2500));
              } catch (err) {
                console.error(`Failed to send to ${lead.email}:`, err.message);
                lead.status = 'failed';
                lead.error = err.message;
                sentBatch.push(lead);
              }
            }

            state.history = state.history || [];
            state.history.push({
              run_at: new Date().toISOString(),
              sent_count: sentCount,
              leads: sentBatch
            });
            state.remaining_queue = nextRemaining;

            fs.writeFileSync(QUEUE_PATH, JSON.stringify(state, null, 2));
            console.log(`Successfully processed and sent ${sentCount}/${batch.length} leads.`);
          }

          run().catch(err => {
            console.error('Fatal batch processing error:', err);
            process.exit(1);
          });
          EOF

      - name: Commit and push queue state
        run: |
          git config user.name "Zero Hype"
          git config user.email "zerohype@proton.me"
          git add zerohype_queue_state.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(outbound): process batch of 20 leads [skip ci]"
            git push origin main
          fi
