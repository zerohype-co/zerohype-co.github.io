<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Zero Hype</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://zerohypelab.com/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --yellow: #E8FD27;
      --bg: #111111;
      --fg: #F5F2EC;
      --mid: #888888;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .wrap { text-align: center; max-width: 480px; }
    .code {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 20vw, 9rem);
      color: var(--yellow);
      line-height: 1;
      letter-spacing: 0.02em;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      color: var(--fg);
      letter-spacing: 0.04em;
      margin-top: 0.75rem;
    }
    p {
      color: var(--mid);
      font-size: 0.9rem;
      margin-top: 0.75rem;
      line-height: 1.6;
    }
    a.btn {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      background: var(--yellow);
      color: #111111;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.06em;
      text-decoration: none;
    }
    a.btn:hover { background: #d4e820; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>PAGE NOT FOUND</h1>
    <p>This URL doesn't exist. No hype about that either.</p>
    <a href="https://zerohypelab.com/" class="btn">BACK TO HOME</a>
  </div>
</body>
</html>
