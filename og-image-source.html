<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #E8FD27;
    font-family: 'Arial Black', sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 80px;
  }
  .label { font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; color: #111; margin-bottom: 32px; font-family: monospace; opacity: 0.5; }
  .headline { font-size: 68px; font-weight: 900; color: #111; line-height: 1.05; }
  .sub { margin-top: 24px; font-size: 18px; color: #111; opacity: 0.6; font-family: monospace; }
  .domain { position: absolute; bottom: 40px; right: 80px; font-size: 13px; color: #111; opacity: 0.4; font-family: monospace; letter-spacing: 0.1em; }
</style>
</head>
<body>
  <div class="label">zerohypelab.com</div>
  <div class="headline">No fluff.<br>No hype.<br>Just what works.</div>
  <div class="sub">B2B marketing diagnostics</div>
  <div class="domain">zerohypelab.com</div>
</body>
</html>
